version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: scai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scai-app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - SQLITE_PATH=/db/supply_chain.db
    volumes:
      - db_data:/db
    restart: on-failure
    stdin_open: false
    tty: false

volumes:
  redis_data:
    driver: local
  db_data:
    driver: local
